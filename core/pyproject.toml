[tool.poetry]
name = "datayoga-core"
version = "0.0.0"
description = "DataYoga for Python"
authors = ["DataYoga <admin@datayoga.io>"]
license = "Apache-2.0"
readme = "README.md"
include = []

classifiers = [
        "Development Status :: 4 - Beta",
        "Intended Audience :: Developers",
        "License :: OSI Approved :: Apache Software License",
        "Programming Language :: Python :: 3.10",
        "Programming Language :: Python :: 3.11",
        "Programming Language :: Python :: 3.12",
        "Programming Language :: Python :: 3.13",
        "Topic :: Database"
]

[tool.poetry.dependencies]
certifi = ">=2026.10.18"
pysqlite3-binary = { version = "^0.5.0", markers = "sys_platform == 'linux' and platform_machine == 'x86_64'" }
cryptography = ">=49.0.0"
Jinja2 = "^3.1.2"
jmespath = "^1.0.0"
jsonschema = "^4.4.0"
orjson = "^3.11.6"
prometheus-client = "^0.16.0"
python = "^3.10"
PyYAML = "^6.0"
sqlglot = "^10.4.3"

hypothesis = { version = "^6.0", optional = true }
mock = { version = "^4.0.3", optional = true }
pytest = { version = ">=9.0.3", optional = true }
pytest-asyncio = { version = "^1.0.0", optional = true }
pytest-describe = { version = "^3.0.0", optional = true }
pytest-mock = { version = "^3.14.0", optional = true }
pytest-timeout = { version = "^2.3.0", optional = true }
requests-mock = { version = "^1.9.3", optional = true }
testcontainers = { version = "^3.7.0", optional = true }

azure-eventhub = { version = "^5.11.2", optional = true }
azure-eventhub-checkpointstoreblob-aio = { version = "^1.1.4", optional = true }
aiohttp = { version = "^3.14.4", optional = true }
cassandra-driver = { version = "^3.25.0", optional = true }
fastparquet = { version = ">=2023.2.0", optional = true }
hiredis = { version = "^2.2.2", optional = true }
ibm_db_sa = { version = "^0.4.0", optional = true }
oracledb = { version = "^1.2.2", optional = true }
psycopg2-binary = { version = "^2.9.5", optional = true }
pymssql = { version = ">=2.2.7,<2.3.0", optional = true }
PyMySQL = { version = "^1.1.1", optional = true }
redis = { version = "^5.0.8", optional = true }
SQLAlchemy = { version = "^2.0.4", optional = true }

[tool.poetry.extras]
azure = ["azure-eventhub", "azure-eventhub-checkpointstoreblob-aio"]
db2 = ["ibm_db_sa"]
cassandra = ["cassandra-driver"]
http = ["aiohttp"]
mysql = ["PyMySQL", "SQLAlchemy"]
oracle = ["oracledb", "SQLAlchemy"]
parquet = ["fastparquet"]
pg = ["psycopg2-binary", "SQLAlchemy"]
redis = ["hiredis", "redis"]
sqlserver = ["pymssql", "SQLAlchemy"]

unit-test = [
        "aiohttp",
        "azure-eventhub",
        "azure-eventhub-checkpointstoreblob-aio",
        "fastparquet",
        "hypothesis",
        "mock",
        "pytest",
        "pytest-asyncio",
        "pytest-mock",
        "redis",
        "requests-mock",
        "SQLAlchemy"
]

test = [
        "aiohttp",
        "azure-eventhub",
        "azure-eventhub-checkpointstoreblob-aio",
        "cassandra-driver",
        "fastparquet",
        "hypothesis",
        "ibm_db_sa",
        "mock",
        "oracledb",
        "psycopg2-binary",
        "pymssql",
        "PyMySQL",
        "pytest",
        "pytest-asyncio",
        "pytest-describe",
        "pytest-mock",
        "pytest-timeout",
        "redis",
        "requests-mock",
        "SQLAlchemy",
        "testcontainers"
]

[tool.poetry.urls]
url = "https://datayoga.io"
[tool.poetry.scripts]

[tool.poetry.group.dev.dependencies]
redis = "5.0.8"
testcontainers = ">=3.7.0,<4.0.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
