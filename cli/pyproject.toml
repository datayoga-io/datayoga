[tool.poetry]
name = "datayoga"
version = "0.0.0"
description = "DataYoga command line interface"
authors = ["DataYoga <admin@datayoga.io>"]
license = "Apache-2.0"
readme = "README.md"
include = []

classifiers = [
        "Development Status :: 4 - Beta",
        "Intended Audience :: Developers",
        "License :: OSI Approved :: Apache Software License",
        "Programming Language :: Python :: 3.10",
        "Programming Language :: Python :: 3.11",
        "Programming Language :: Python :: 3.12",
        "Programming Language :: Python :: 3.13",
        "Topic :: Database"
]

[tool.poetry.dependencies]
certifi = ">=2026.10.18"
click = "^8.0.3"
datayoga-core = "1.*"
jsonschema = "^4.4.0"
python = "^3.10"
PyYAML = "^6.0"

mock = { version = "^4.0.3", optional = true }
pytest = { version = ">=9.0.3", optional = true }
pytest-asyncio = { version = "^1.0.0", optional = true }
pytest-describe = { version = "^3.0.0", optional = true }
pytest-mock = { version = "^3.14.0", optional = true }
pytest-timeout = { version = "^2.3.0", optional = true }
requests-mock = { version = "^1.9.3", optional = true }

[tool.poetry.extras]
test = [
        "mock",
        "pytest",
        "pytest-describe",
        "pytest-mock",
        "pytest-timeout",
        "requests-mock"
]


[tool.poetry.urls]
url = "https://datayoga.io"

[tool.poetry.scripts]
datayoga = "datayoga.__main__:main"


[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
