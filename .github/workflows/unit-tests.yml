name: unit-tests
on:
  workflow_dispatch:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  unit-tests:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            python: "3.8"
            sqlite-module: pysqlite3
          - runner: ubuntu-latest
            python: "3.11"
            sqlite-module: pysqlite3
          - runner: ubuntu-24.04-arm
            python: "3.11"
            sqlite-module: sqlite3
    env:
      TZ: UTC
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        working-directory: core
        run: |
          pip install poetry==1.8.5
          poetry install --only main --extras unit-test
          poetry run pip check

      - name: Verify SQLite backend
        working-directory: core
        env:
          EXPECTED_SQLITE_MODULE: ${{ matrix.sqlite-module }}
        run: |
          poetry run python -c 'import os; from datayoga_core.expression import sqlite3; print(sqlite3.__name__, sqlite3.sqlite_version); assert sqlite3.__name__ == os.environ["EXPECTED_SQLITE_MODULE"]'

      - name: Run tests
        working-directory: core
        run: poetry run python -m pytest -s --log-cli-level=DEBUG
